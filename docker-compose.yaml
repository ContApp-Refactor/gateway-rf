services:
  gateway:
    image: jeserna/gateway:v0.0.1165
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/api/`)"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    container_name: gateway
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
        test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health/liveness"]
        interval: 10s
        timeout: 3s
        retries: 3
        start_period: 30s
        start_interval: 10s

networks:
  dokploy-network:
    external: true
